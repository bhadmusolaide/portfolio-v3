[build]
  base = "portfolio-site"
  publish = "out"
  command = "npm run build"

[[redirects]]
  from = "/resume"
  to = "/master-resume.html"
  status = 200

[[redirects]]
  from = "/case-studies/career-suite"
  to = "/case-studies/career-suite.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
